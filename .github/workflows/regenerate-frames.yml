name: Regenerate midpoint frames in batches

"on":
  workflow_dispatch:
  push:
    paths:
      - ".frame-regeneration-batch-launch"

permissions:
  contents: write

concurrency:
  group: midpoint-frame-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    name: Test 10, then process batches of 50 and update Neon
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare persistent batch branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/main:refs/remotes/origin/main

          if git ls-remote --exit-code --heads origin refs/heads/frame-regeneration-batches >/dev/null 2>&1; then
            git fetch origin +refs/heads/frame-regeneration-batches:refs/remotes/origin/frame-regeneration-batches
            git checkout -B frame-regeneration-batches origin/frame-regeneration-batches

            # Each completed batch is published to both this branch and main.
            # If main is behind, resuming is safe. If main has unrelated new
            # commits, stop explicitly rather than merging workflow changes
            # into a token-authenticated frame push.
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::main has commits that are not in frame-regeneration-batches."
              echo "::error::No checkpoint files will be overwritten. Reconcile the branch before rerunning."
              exit 1
            fi
          else
            git checkout -B frame-regeneration-batches origin/main
            git push --set-upstream origin frame-regeneration-batches
          fi

      - name: Install FFmpeg if required
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate batch processor
        run: |
          python -m py_compile scripts/regenerate_frames.py
          python -m py_compile scripts/process_frame_batches.py

      - name: Process batches and update Neon after each batch
        run: python scripts/process_frame_batches.py

      - name: Upload JSON and CSV error reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-frame-batch-report
          path: |
            reports/frame-regeneration-report.json
            reports/frame-regeneration-errors.csv
            frame-progress.json
          if-no-files-found: warn
          retention-days: 30
