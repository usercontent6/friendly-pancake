name: Regenerate midpoint frames

"on":
  workflow_dispatch:
  push:
    paths:
      - ".frame-regeneration-launch"

permissions:
  contents: write

concurrency:
  group: midpoint-frame-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    name: Extract frames and update Neon
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}
      FRAME_MANIFEST: /tmp/frame_manifest.json

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Prepare persistent checkpoint branch
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if git ls-remote --exit-code --heads origin refs/heads/frame-regeneration-progress >/dev/null 2>&1; then
            git fetch origin +refs/heads/frame-regeneration-progress:refs/remotes/origin/frame-regeneration-progress
            git checkout -B frame-regeneration-progress origin/frame-regeneration-progress
            git merge --no-edit origin/main
          else
            git checkout -B frame-regeneration-progress origin/main
            git push --set-upstream origin frame-regeneration-progress
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate Python script
        run: python -m py_compile scripts/regenerate_frames.py

      - name: Generate midpoint frames
        id: generate
        run: python scripts/regenerate_frames.py

      - name: Publish checkpointed frames to main
        id: publish
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the persistent checkpoint branch in sync with the latest main.
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge --no-edit origin/main
          git push origin HEAD:refs/heads/frame-regeneration-progress

          # Retry the final main push after merging any commits added while this
          # job was processing. Extracted frames remain safely on the checkpoint
          # branch even if main cannot be updated yet.
          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              git push origin HEAD:refs/heads/frame-regeneration-progress
            fi

            if git push origin HEAD:refs/heads/main; then
              echo "Published checkpointed frames to main."
              exit 0
            fi

            echo "Main moved during push; retrying merge/push (attempt $attempt of 5)."
            sleep 3
          done

          echo "Could not publish to main after 5 attempts. Frames remain on frame-regeneration-progress."
          exit 1

      - name: Update successful Neon img URLs
        if: steps.generate.outcome == 'success' && steps.publish.outcome == 'success'
        run: python scripts/regenerate_frames.py --update-db

      - name: Upload JSON and CSV error reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-frame-regeneration-report
          path: |
            reports/frame-regeneration-report.json
            reports/frame-regeneration-errors.csv
          if-no-files-found: warn
          retention-days: 30
