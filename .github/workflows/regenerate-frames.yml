name: Regenerate midpoint frames

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".frame-regeneration-launch"

permissions:
  contents: write

concurrency:
  group: midpoint-frame-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    name: Extract frames and update Neon
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: \${{ secrets.DATABASE_URL }}
      PAGES_BASE_URL: \${{ vars.PAGES_BASE_URL }}
      VIDEO_BASE_URL: \${{ vars.VIDEO_BASE_URL }}
      FRAME_MANIFEST: /tmp/frame_manifest.json

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Confirm the workflow is running for main
        run: |
          if [ "\${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate Python script
        run: python -m py_compile scripts/regenerate_frames.py

      - name: Generate midpoint frames
        id: generate
        run: python scripts/regenerate_frames.py

      - name: Commit and push successful frames
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all frames
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate successful midpoint frames"
            git push origin HEAD:main
          else
            echo "No frame files changed."
          fi

      - name: Update successful Neon img URLs
        if: steps.generate.outcome == 'success'
        run: python scripts/regenerate_frames.py --update-db

      - name: Commit regeneration report
        if: always()
        run: |
          mkdir -p reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Add midpoint frame regeneration report"
            git push origin HEAD:main
          else
            echo "No regeneration report changes to commit."
          fi

      - name: Upload JSON and CSV error reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-frame-regeneration-report
          path: |
            reports/frame-regeneration-report.json
            reports/frame-regeneration-errors.csv
          if-no-files-found: warn
          retention-days: 30
